services:
  service1:
    build:
      context: ./service1
      dockerfile: Dockerfile
    image: service1:latest
    ports: 
      - "8199:8199"
    volumes:
      - vStorage:/data
    networks:
      - internal
      - public
    user: root
  service2:
    build:
      context: ./service2
      dockerfile: Dockerfile
    image: service2:latest
    ports:
      - "5000:5000"
    volumes:
      - vStorage:/data
    networks:
      - internal

volumes:
  vStorage:
    driver: local

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
